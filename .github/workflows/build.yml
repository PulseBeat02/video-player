name: Build

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

env:
  VCPKG_BINARY_SOURCES: 'clear;x-gha,readwrite'

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04
            triplet: x64-linux
            msvc_arch: ''
          - name: linux-arm64
            os: ubuntu-22.04-arm
            triplet: arm64-linux
            msvc_arch: ''
          - name: windows-x64
            os: windows-2022
            triplet: x64-windows-static
            msvc_arch: x64
          - name: windows-x86
            os: windows-2022
            triplet: x86-windows-static
            msvc_arch: x86
          - name: windows-arm64
            os: windows-11-arm
            triplet: arm64-windows-static
            msvc_arch: arm64
          - name: macos-x64
            os: macos-15-intel
            triplet: x64-osx
            msvc_arch: ''
          - name: macos-arm64
            os: macos-14
            triplet: arm64-osx
            msvc_arch: ''

    steps:
      - uses: actions/checkout@v6

      - name: Export GitHub Actions cache env
        uses: actions/github-script@v9
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build nasm autoconf autoconf-archive automake libtool pkg-config \
            xorg-dev libxinerama-dev libxcursor-dev libxrandr-dev libxi-dev libglu1-mesa-dev \
            libgl1-mesa-dev libwayland-dev wayland-protocols libxkbcommon-dev \
            libasound2-dev libpulse-dev

      - name: Install macOS deps
        if: runner.os == 'macOS'
        run: brew install ninja nasm automake autoconf autoconf-archive libtool pkg-config

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        uses: seanmiddleditch/gha-setup-ninja@v6

      - name: Install pkg-config (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install pkgconfiglite -y --no-progress
          pkg-config --version

      - name: Bootstrap vcpkg
        shell: bash
        run: |
          BASELINE=$(awk -F'"' '/builtin-baseline/ {print $4}' vcpkg.json)
          if [ ! -d "$HOME/vcpkg/.git" ]; then
            git clone https://github.com/microsoft/vcpkg.git "$HOME/vcpkg"
          fi
          git -C "$HOME/vcpkg" fetch --depth=1 origin "$BASELINE"
          git -C "$HOME/vcpkg" checkout "$BASELINE"
          if [ "$RUNNER_OS" = "Windows" ]; then
            "$HOME/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          else
            "$HOME/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          fi
          echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"

      - name: Configure
        shell: bash
        run: |
          cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} \
            -DVCPKG_MANIFEST_MODE=ON \
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

      - name: Build
        shell: bash
        run: cmake --build build --parallel

      - name: Stage artifacts
        shell: bash
        run: |
          mkdir -p dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp build/graphics.exe "dist/video-player-${{ matrix.name }}.exe"
          else
            cp build/graphics "dist/video-player-${{ matrix.name }}"
          fi
          ls -la dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: video-player-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish Release
    needs: [ build ]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        shell: bash
        run: ls -la artifacts/

      - name: Compute release metadata
        id: meta
        shell: bash
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          COMMIT_SUBJECT=$(git log -1 --pretty=%s)
          COMMIT_BODY=$(git log -1 --pretty=%b)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            NAME="$TAG - $COMMIT_SUBJECT"
            PRERELEASE=false
          else
            DATE=$(date -u +'%Y-%m-%d')
            TAG="build-${DATE}-${SHORT_SHA}"
            NAME="${DATE} - ${COMMIT_SUBJECT}"
            PRERELEASE=true
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          {
            echo "name<<META_EOF"
            echo "$NAME"
            echo "META_EOF"
            echo "body<<META_EOF"
            echo "Automated build from commit \`$SHORT_SHA\` (${GITHUB_SHA})."
            echo ""
            echo "**$COMMIT_SUBJECT**"
            if [ -n "$COMMIT_BODY" ]; then
              echo ""
              echo "$COMMIT_BODY"
            fi
            echo "META_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          body: ${{ steps.meta.outputs.body }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          target_commitish: ${{ github.sha }}
          files: artifacts/**/*
          fail_on_unmatched_files: true
